name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # matches Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        # requirements.txt ships no lint tooling; pin here to keep the gate
        # frozen independent of dependency bumps.
        run: |
          pip install ruff==0.17.1
          ruff check .

      - name: Test (coverage gate via pytest.ini addopts)
        # No .env in CI: settings boot only requires INTERNAL_API_KEY
        # (everything else has safe defaults; conftest.py injects test values).
        env:
          INTERNAL_API_KEY: ci-dummy-internal-key
        run: pytest --cov=apps --cov-report=term-missing

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/hfizmzr/pelikat-api:staging
            ghcr.io/hfizmzr/pelikat-api:sha-${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_API }}
    steps:
      - name: Redeploy Portainer staging stack
        if: env.WEBHOOK_URL != ''
        run: curl --fail -sS -o /dev/null --max-time 30 -X POST "$WEBHOOK_URL"

      - name: Skip webhook (secret not set)
        if: env.WEBHOOK_URL == ''
        run: 'echo "skip: PORTAINER_WEBHOOK_URL_API secret not set yet"'
