name: CI

permissions:
  contents: read

# Serialize master CI runs: cancel-in-progress: false is plain FIFO queueing,
# not overwriting protection — the oldest run finishes first, then the newest
# SHA's run pushes :staging and fires the Portainer webhook (newest image wins).
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master, staging] # both deploy the :staging image + Portainer webhook
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # matches Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        # requirements.txt ships no lint tooling; pin here to keep the gate
        # frozen independent of dependency bumps.
        run: |
          pip install ruff==0.17.1
          ruff check .

      - name: Test (coverage gate via pytest.ini addopts)
        # No .env in CI: settings boot only requires INTERNAL_API_KEY
        # (everything else has safe defaults; conftest.py injects test values).
        env:
          INTERNAL_API_KEY: ci-dummy-internal-key
        run: pytest --cov=apps --cov-report=term-missing

  docker:
    # Images live on Docker Hub (docker.io/hfizmzr/pelikat-api, public).
    # :staging is a mutable tag that Portainer re-pulls on every webhook
    # redeploy. Missing DOCKERHUB_* secrets fail the login step immediately
    # and the deploy job (needs: docker) never fires — no skip-guard ceremony.
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            docker.io/hfizmzr/pelikat-api:staging
            docker.io/hfizmzr/pelikat-api:sha-${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_API }}
    steps:
      - name: Redeploy Portainer staging stack
        # Fail fast: a missing PORTAINER_WEBHOOK_URL_API secret makes this
        # job red instead of silently skipping the staging redeploy.
        # The webhook is reachable only via a flaky reverse-proxy VPS that
        # drops ~50% of TCP connects; retry up to 5 attempts before failing
        # (curl alone doesn't retry network errors without --retry-all-errors).
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail -sS -o /dev/null --connect-timeout 15 --max-time 60 -X POST "$WEBHOOK_URL"; then
              exit 0
            fi
            echo "attempt $i failed (exit $?); retrying in 10s..."
            sleep 10
          done
          echo "all 5 webhook attempts failed"
          exit 1
