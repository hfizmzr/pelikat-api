[pytest]
DJANGO_SETTINGS_MODULE = pelikat.settings
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=apps --cov-report=term-missing --cov-fail-under=90
markers =
    performance: marks performance tests (slow)
    security: marks security tests
    reliability: marks reliability tests
    scalability: marks scalability tests
    availability: marks availability tests
    smoke: marks smoke tests
