# Portainer stack env (Stack > Environment) is the single source of truth.
# Every variable configured there is injected into compose as process env and
# passes through via ${VAR} interpolation below. Do NOT add env_file: .env —
# Git-managed stacks pull this file from GitHub where .env is gitignored, so
# compose would crash resolving a missing /data/compose/4/.env.

services:
  api:
    image: docker.io/hfizmzr/pelikat-api:staging
    # Mutable :staging tag — always re-pull so webhook redeploys pick up a new
    # image even when the git ref didn't change.
    pull_policy: always
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Django core (settings.py)
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - HMAC_SECRET=${HMAC_SECRET:-}
      # INTERNAL_API_KEY is required at boot — fail fast if Portainer env lacks it
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY not set in Portainer stack env}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - DOCUMENT_ENCRYPTION_KEY=${DOCUMENT_ENCRYPTION_KEY:-}
      # HitPay (optional-empty; settings.py handles unset gracefully)
      - HITPAY_API_URL=${HITPAY_API_URL:-}
      - HITPAY_API_KEY=${HITPAY_API_KEY:-}
      - HITPAY_WEBHOOK_SALT=${HITPAY_WEBHOOK_SALT:-}
      - HITPAY_PAYMENT_METHODS=${HITPAY_PAYMENT_METHODS:-}
    restart: unless-stopped
    healthcheck:
      # Django has no route at "/" — any HTTP status (incl. 404) means the
      # server is up; only connection failures mark the container unhealthy.
      test: ["CMD-SHELL", "python -c \"import http.client; c = http.client.HTTPConnection('localhost', 8000, timeout=3); c.request('GET', '/'); c.getresponse().read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # AI photo pipeline (FR-16): drains the photo_batch_items queue. Keep it
  # at one replica — see apps/ai_photos/management/commands/run_photo_worker.py.
  photo-worker:
    image: docker.io/hfizmzr/pelikat-api:staging
    pull_policy: always
    command: python manage.py run_photo_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM lets the worker finish its current photo; Docker's default is
    # to SIGKILL after 10s, which could cut a slow photo off mid-write.
    stop_grace_period: 2m
    environment:
      # show progress lines live in `docker logs` (stdout is block-buffered otherwise)
      - PYTHONUNBUFFERED=1
      # Same Portainer stack env passthrough as the api service (AI_PHOTOS_*
      # tuning vars omitted — settings.py has safe defaults for them).
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - HMAC_SECRET=${HMAC_SECRET:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY not set in Portainer stack env}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - DOCUMENT_ENCRYPTION_KEY=${DOCUMENT_ENCRYPTION_KEY:-}
      - HITPAY_API_URL=${HITPAY_API_URL:-}
      - HITPAY_API_KEY=${HITPAY_API_KEY:-}
      - HITPAY_WEBHOOK_SALT=${HITPAY_WEBHOOK_SALT:-}
      - HITPAY_PAYMENT_METHODS=${HITPAY_PAYMENT_METHODS:-}
    restart: unless-stopped

  migrate:
    image: docker.io/hfizmzr/pelikat-api:staging
    command: python manage.py migrate --noinput
    environment:
      # Same Portainer stack env passthrough as the api service.
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - HMAC_SECRET=${HMAC_SECRET:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY not set in Portainer stack env}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - DOCUMENT_ENCRYPTION_KEY=${DOCUMENT_ENCRYPTION_KEY:-}
      - HITPAY_API_URL=${HITPAY_API_URL:-}
      - HITPAY_API_KEY=${HITPAY_API_KEY:-}
      - HITPAY_WEBHOOK_SALT=${HITPAY_WEBHOOK_SALT:-}
      - HITPAY_PAYMENT_METHODS=${HITPAY_PAYMENT_METHODS:-}
    restart: "no"
