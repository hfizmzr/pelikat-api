version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      # `*` allows any host — required when using Cloudflare Tunnel
      # because requests come through with the tunnel's public hostname.
      - ALLOWED_HOSTS=localhost,127.0.0.1,*
      - SECRET_KEY=dev-secret-key-do-not-use-in-production
    env_file:
      - .env
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    healthcheck:
      # Django has no route at "/" — any HTTP status (incl. 404) means the
      # server is up; only connection failures mark the container unhealthy.
      test: ["CMD-SHELL", "python -c \"import http.client; c = http.client.HTTPConnection('localhost', 8000, timeout=3); c.request('GET', '/'); c.getresponse().read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pelikat-shared

  # AI photo pipeline (FR-16): drains the photo_batch_items queue.
  # Restart it after changing apps/ai_photos — it has no autoreload.
  photo-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-do-not-use-in-production
      # show progress lines live in `docker logs` (stdout is block-buffered otherwise)
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - .:/app
    command: python manage.py run_photo_worker
    restart: unless-stopped
    networks:
      - pelikat-shared

networks:
  pelikat-shared:
    external: true
